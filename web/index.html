<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>MBTA Trail</title>
	<link rel="stylesheet" href="css/style.css" />
</head>
<body>
	<main id="screen">
		<section id="main-menu-screen">
			<h1>MBTA Trail</h1>
			<p class="flavor-text">A loving, slightly absurd homage to Oregon Trail, Boston, and the MBTA.</p>
			<button id="start-button">Start</button>
		</section>

		<section id="character-select-screen" hidden>
			<h1>Choose Your Commuter</h1>
			<div id="archetype-list"></div>
		</section>

		<section id="game-screen" hidden>
			<h1>MBTA Trail</h1>
			<p id="station"></p>
			<p id="time"></p>
			<p id="money"></p>
			<p id="charliecard"></p>
			<p id="hunger"></p>
			<p id="difficulty"></p>
			<p id="multiplier"></p>
			<button id="ride-button">Ride Train</button>
			<button id="hunt-button">Hunt for Food</button>
			<button id="rest-button">Rest</button>
			<button id="wait-button">Wait</button>
			<p id="ride-message"></p>
			<p id="rest-wait-message"></p>
			<div id="hunt-game" hidden>
				<p class="hunt-instructions">Arrow keys to fly, Space to shoot.</p>
				<p id="hunt-status"></p>
				<div id="hunt-arena"></div>
			</div>
			<p id="hunt-message"></p>

			<h2>Buy Food</h2>
			<div id="food-menu"></div>
			<p id="food-message"></p>
		</section>

		<section id="victory-screen" hidden>
			<h1>You Made It!</h1>
			<p class="flavor-text">Park Street. You survived the Boston commute.</p>
			<p id="victory-time"></p>
			<p id="victory-money"></p>
			<p id="victory-charliecard"></p>
			<p id="victory-score"></p>
			<button id="play-again-button">Play Again</button>
		</section>

		<section id="game-over-screen" hidden>
			<h1>Game Over</h1>
			<p id="game-over-reason"></p>
			<button id="try-again-button">Try Again</button>
		</section>
	</main>
	<script type="module" src="js/main.js"></script>
</body>
</html>
